name: Native OCI build

'on':
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: Immutable fork tag, including the distroless variant
        required: true
        default: 1.31.1-drj.1-distroless

permissions:
  contents: read

jobs:
  proxy:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Start native proxy job budget
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PROXY_JOB_START_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: istio
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DRJ-Technologies/proxy
          ref: main
          path: proxy
          persist-credentials: false
      - name: Install native proxy host dependencies
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          # The pinned LLVM x86-64 release needs SONAME5. Jammy provides the
          # genuine library through signed APT; Noble only provides SONAME6.
          # QAT's native autogen requires AX_PTHREAD from Autoconf Archive.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo5 autoconf-archive
      - name: Prepare disposable proxy runner storage
        shell: bash
        run: |
          set -euo pipefail
          # Native hosted runners provide Bazelisk. The checkout's .bazelversion
          # selects Bazel; WORKSPACE retains its hermetic LLVM and sysroots.
          command -v bazelisk
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          mkdir -p "$RUNNER_TEMP/proxy-tmp" "$RUNNER_TEMP/proxy-export"
          printf 'PROXY_CACHE_DIR=%s/proxy-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Select native proxy cache
        id: proxy-inputs
        env:
          PROXY_RUNNER: ${{ matrix.runner }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(next(x["lastStableSHA"] for x in json.load(open("../istio/istio.deps")) if x["name"] == "PROXY_REPO_SHA"))')"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'cache_prefix=native-proxy-%s-%s\n' "$PROXY_RUNNER" "$expected" >> "$GITHUB_OUTPUT"
          mkdir -p "$PROXY_CACHE_DIR/disk" "$PROXY_CACHE_DIR/repository"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ env.PROXY_CACHE_DIR }}
          key: ${{ steps.proxy-inputs.outputs.cache_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.proxy-inputs.outputs.cache_prefix }}-
      - name: Build native release proxy
        env:
          PROXY_MACHINE: ${{ matrix.machine }}
        shell: bash
        run: |
          set -euo pipefail
          check_source() {
            local repo="$1" expected="$2" status
            status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"
            printf 'Source status: %s\n%s\n' "$repo" "$status"
            git -C "$repo" diff --stat HEAD --
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected"
            test -z "$status"
          }
          expected="$(python3 -c 'import json; print(next(x["lastStableSHA"] for x in json.load(open("../istio/istio.deps")) if x["name"] == "PROXY_REPO_SHA"))')"
          check_source ../istio "$GITHUB_SHA"
          check_source . "$expected"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$PROXY_MACHINE"
          # Preserve the native version/toolchain declarations and actual Git
          # stamps rather than accepting external replacements or RBE settings.
          unset BUILD_SCM_REVISION BUILD_SCM_STATUS USE_BAZEL_VERSION USE_BAZEL_FALLBACK_VERSION
          unset BAZELISK_BASE_URL BAZELISK_FORMAT_URL BAZEL_LLVM_PATH BAZEL_USE_HOST_SYSROOT BAZEL_USE_LIBSTDCPP
          export BUILD_CONFIG=release TMPDIR="$RUNNER_TEMP/proxy-tmp"
          test "$(bazelisk --version)" = "bazel $(cat .bazelversion)"
          startup=(--nosystem_rc --nohome_rc --output_user_root="$RUNNER_TEMP/proxy-bazel")
          # Retain native server metadata before building, without enabling disk
          # GC yet. Finalization needs its current log and exact server PID.
          timeout --signal=INT --kill-after=10s 60s \
            bazelisk "${startup[@]}" info --config=release --stamp server_log server_pid \
            > "$RUNNER_TEMP/native-proxy-server-info.log"
          resources() {
            nproc
            free -h
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          }
          resources | tee "$RUNNER_TEMP/native-proxy-build.log"
          # Use the standard runner's native CPU count, without oversubscribing
          # Bazel's CPU or memory resource limits. Preparation consumes the same
          # 325-minute budget; reserve bounded native disk GC, server shutdown,
          # cache persistence and uploads within the 360-minute hosted limit.
          remaining=$((325 * 60 - ($(date +%s) - PROXY_JOB_START_EPOCH)))
          if (( remaining <= 0 || remaining > 325 * 60 )); then
            echo 'Native proxy job budget unavailable; no build or release artifact'
            exit 124
          fi
          printf 'Native proxy remaining build budget: %s seconds\n' "$remaining"
          result=0
          timeout --signal=INT --kill-after=120s "${remaining}s" \
            bazelisk "${startup[@]}" build --config=release --stamp --jobs=HOST_CPUS \
              --disk_cache="$PROXY_CACHE_DIR/disk" --repository_cache="$PROXY_CACHE_DIR/repository" \
              --profile="$RUNNER_TEMP/native-proxy-profile.json.gz" //:envoy_tar \
            2>&1 | tee -a "$RUNNER_TEMP/native-proxy-build.log" || result=$?
          resources | tee -a "$RUNNER_TEMP/native-proxy-build.log"
          if [[ "$result" != 0 ]]; then
            printf 'Native proxy incomplete (exit %s); no release artifact\n' "$result"
            exit "$result"
          fi
          bin="$(timeout --signal=INT --kill-after=10s 60s bazelisk "${startup[@]}" info --config=release --stamp bazel-bin)"
          test -s "$bin/envoy" && test -x "$bin/envoy"
          test -s "$bin/envoy_tar.tar.gz"
          check_source ../istio "$GITHUB_SHA"
          check_source . "$expected"
          cp "$bin/envoy" "$bin/envoy_tar.tar.gz" "$RUNNER_TEMP/proxy-export/"
      - name: Check native proxy cache size
        id: proxy-cache-size
        if: always()
        timeout-minutes: 8
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Cache failure must not replace the original build result. An absent
          # save output also prevents persistence if this bounded step is killed.
          skip_cache() {
            printf 'Native cache persistence skipped: %s\n' "$1"
            exit 0
          }
          trap 'skip_cache "finalization command failed"' ERR
          if [[ ! -d "$PROXY_CACHE_DIR/disk" || ! -d "$PROXY_CACHE_DIR/repository" ]]; then
            skip_cache 'no native cache produced'
          fi
          # A failed/timed-out build may retain completed actions, but modified
          # source must not write a cache under the declared source namespace.
          expected="$(python3 -c 'import json; print(next(x["lastStableSHA"] for x in json.load(open("../istio/istio.deps")) if x["name"] == "PROXY_REPO_SHA"))')"
          test "$(git -C ../istio rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git -C ../istio status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          unset BUILD_SCM_REVISION BUILD_SCM_STATUS USE_BAZEL_VERSION USE_BAZEL_FALLBACK_VERSION
          unset BAZELISK_BASE_URL BAZELISK_FORMAT_URL BAZEL_LLVM_PATH BAZEL_USE_HOST_SYSROOT BAZEL_USE_LIBSTDCPP
          export BUILD_CONFIG=release TMPDIR="$RUNNER_TEMP/proxy-tmp"
          startup=(--nosystem_rc --nohome_rc --output_user_root="$RUNNER_TEMP/proxy-bazel")
          server_log="$(sed -n 's/^server_log: //p' "$RUNNER_TEMP/native-proxy-server-info.log")"
          server_pid="$(sed -n 's/^server_pid: //p' "$RUNNER_TEMP/native-proxy-server-info.log")"
          [[ "$server_pid" =~ ^[1-9][0-9]*$ ]] || skip_cache 'native server PID unavailable'
          test -d "/proc/$server_pid" || skip_cache 'original native server already absent'
          allowance=4000000000
          repository_bytes="$(timeout 30s du -sb "$PROXY_CACHE_DIR/repository" | cut -f1)"
          [[ "$repository_bytes" =~ ^[0-9]+$ ]]
          # Native disk GC counts file bytes, excludes gc/tmp, and does not trim
          # repository downloads. Leave 5% of the SAME combined cap for metadata.
          disk_budget=$((allowance - repository_bytes - allowance / 20))
          printf 'Native repository bytes: %s; disk GC budget: %s; combined cap: %s\n' \
            "$repository_bytes" "$disk_budget" "$allowance"
          # One observer reads only this command's native log tail. Bazel's
          # logger can buffer idle-task records until normal server shutdown.
          cat > "$RUNNER_TEMP/native-proxy-gc-observer.py" <<'PY'
          import os, re, sys, time
          mode, path, device, inode, offset, diagnostics = sys.argv[1:]
          device, inode, offset = map(int, (device, inode, offset))
          deadline, minimum_size, records = time.monotonic() + 240, offset, []

          def finish(code, message):
              # Retain only bounded GC messages, never the complete Java log.
              with open(diagnostics, "a") as output:
                  output.write(mode + ": " + message + "\n")
                  output.write("\n".join(records)[-16384:] + "\n")
              print(message)
              sys.exit(code)

          def check(state):
              if (state.st_dev, state.st_ino) != (device, inode) or state.st_size < minimum_size:
                  raise ValueError("Native GC log changed identity or was truncated")

          while True:
              started, completed, partial, records = False, False, False, []
              try:
                  check(os.stat(path))
                  with open(path, "rb") as log:
                      check(os.fstat(log.fileno()))
                      log.seek(offset)
                      for raw in log:
                          partial = not raw.endswith(b"\n")
                          line = raw.decode("utf-8", errors="replace")
                          summary = re.search(r"Deleted \d+ of \d+ files, reclaimed .+ of .+ in .+ seconds", line)
                          marker = line.find("Disk cache garbage collection ")
                          if marker >= 0 or summary:
                              records.append(line[marker if marker >= 0 else summary.start():].strip()[:2048])
                              records = records[-16:]
                          # Refusals anywhere in the fresh tail are sticky,
                          # including records after an earlier valid summary.
                          if "Disk cache garbage collection failed" in line or "Disk cache garbage collection interrupted" in line:
                              raise ValueError("Current native disk GC failed or was interrupted")
                          if "concurrent update detected" in line:
                              raise ValueError("Concurrent native cache update during GC")
                          if "Disk cache garbage collection started" in line:
                              started, completed = True, False
                          elif started and summary and not partial:
                              completed = True
                      minimum_size = max(minimum_size, log.tell())
                      check(os.fstat(log.fileno()))
                  check(os.stat(path))
              except (OSError, ValueError) as error:
                  finish(1, str(error))
              if completed and not partial:
                  finish(0, "Current native disk GC completion observed")
              if mode == "final" or time.monotonic() >= deadline:
                  finish(2, "Current native disk GC completion unavailable")
              time.sleep(1)
          PY
          gc_possible=false
          if (( disk_budget > 0 )) && [[ -f "$server_log" && -r "$server_log" ]]; then
            # Record this file's identity and EOF BEFORE the sole GC-enabled
            # command. The build/earlier info commands never enabled disk GC.
            read -r log_device log_inode log_offset < <(stat -Lc '%d %i %s' "$server_log")
            if timeout --signal=INT --kill-after=10s 60s \
              bazelisk "${startup[@]}" info --config=release --stamp \
                --disk_cache="$PROXY_CACHE_DIR/disk" --repository_cache="$PROXY_CACHE_DIR/repository" \
                --experimental_disk_cache_gc_idle_delay=0s \
                --experimental_disk_cache_gc_max_size="$disk_budget" server_log \
                > "$RUNNER_TEMP/native-proxy-gc-info.log" && \
              [[ "$(cat "$RUNNER_TEMP/native-proxy-gc-info.log")" == "$server_log" ]]; then
              gc_possible=true
              # Read only: another Bazel command would interrupt idle GC.
              # Exit 2 is inconclusive until shutdown flushes buffered records;
              # an explicit refusal remains denying even if later text changes.
              if python3 "$RUNNER_TEMP/native-proxy-gc-observer.py" wait \
                "$server_log" "$log_device" "$log_inode" "$log_offset" \
                "$RUNNER_TEMP/native-proxy-gc-observation.log"; then
                :
              else
                [[ "$?" == 2 ]] || gc_possible=false
              fi
            fi
          fi
          # Even a failed/unknown GC gets a bounded normal shutdown. Its native
          # client interrupts remaining idle tasks; do not archive live writers.
          if ! timeout --signal=INT --kill-after=10s 60s bazelisk "${startup[@]}" shutdown; then
            skip_cache 'native server shutdown failed'
          fi
          for _ in {1..10}; do
            test -e "/proc/$server_pid" || break
            sleep 1
          done
          test ! -e "/proc/$server_pid" || skip_cache 'native server remains present after shutdown'
          [[ "$gc_possible" == true ]] || skip_cache 'positive disk budget/current native GC evidence refused'
          # Re-read the ENTIRE original tail after the normal shutdown flush,
          # even if completion was visible earlier. Later interruption, failure,
          # concurrent update or log replacement must still deny persistence.
          if ! python3 "$RUNNER_TEMP/native-proxy-gc-observer.py" final \
            "$server_log" "$log_device" "$log_inode" "$log_offset" \
            "$RUNNER_TEMP/native-proxy-gc-observation.log"; then
            skip_cache 'current native GC completion unavailable after shutdown'
          fi
          bytes="$(timeout 30s du -sb "$PROXY_CACHE_DIR" | cut -f1)"
          [[ "$bytes" =~ ^[0-9]+$ ]]
          printf 'Quiescent native proxy cache bytes: %s (save limit %s per architecture)\n' "$bytes" "$allowance"
          (( bytes <= allowance )) || skip_cache 'whole cache exceeds existing allowance'
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.proxy-cache-size.outputs.save == 'true'
        timeout-minutes: 8
        continue-on-error: true
        with:
          path: ${{ env.PROXY_CACHE_DIR }}
          key: ${{ steps.proxy-inputs.outputs.cache_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 8
        with:
          name: native-proxy-${{ matrix.arch }}
          path: ${{ runner.temp }}/proxy-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: native-proxy-log-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-proxy-build.log
            ${{ runner.temp }}/native-proxy-profile.json.gz
            ${{ runner.temp }}/native-proxy-server-info.log
            ${{ runner.temp }}/native-proxy-gc-info.log
            ${{ runner.temp }}/native-proxy-gc-observation.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: proxy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: istio
    env:
      VERSION: 1.31.1
      BUILD_WITH_CONTAINER: '0'
      CGO_ENABLED: '0'
      HUB: localhost/istio
      BUILD_ZTUNNEL_PROFILE: release
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: istio
          persist-credentials: false
      - name: Select artifact tag
        env:
          INPUT_ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        shell: bash
        run: |
          set -euo pipefail
          stem="${INPUT_ARTIFACT_TAG%-distroless}"
          release="${stem##*-drj.}"
          if [[ "$INPUT_ARTIFACT_TAG" != "$VERSION-drj.$release-distroless" || ! "$release" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Expected an immutable fork tag for the selected component version and distroless variant' >&2
            exit 1
          fi
          printf 'TAG=%s\n' "$stem" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DRJ-Technologies/ztunnel
          ref: main
          path: ztunnel
          persist-credentials: false
      - name: Check companion main against native dependency
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(next(x["lastStableSHA"] for x in json.load(open("istio.deps")) if x["name"] == "ZTUNNEL_REPO_SHA"))')"
          test "$(git -C "$GITHUB_WORKSPACE/ztunnel" rev-parse HEAD)" = "$expected"
          printf 'BUILD_ZTUNNEL_REPO=%s/ztunnel\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git -C "$GITHUB_WORKSPACE/ztunnel" rev-parse HEAD
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: istio/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-proxy-amd64
          path: ${{ runner.temp }}/native-proxy-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-proxy-arm64
          path: ${{ runner.temp }}/native-proxy-arm64
      - name: Prepare disposable hosted runner toolchain and storage
        shell: bash
        run: |
          set -euo pipefail
          # These unused SDKs are only removed on this disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev protobuf-compiler gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          rust_version="$(python3 -c 'import os, pathlib, tomllib; print(tomllib.load(open(pathlib.Path(os.environ["BUILD_ZTUNNEL_REPO"]) / "Cargo.toml", "rb"))["package"]["rust-version"])')"
          rustup toolchain install "$rust_version" --profile minimal --target x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$rust_version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/istio-tmp" "$RUNNER_TEMP/istio-oci"
          printf 'TMPDIR=%s/istio-tmp\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Prepare matching native proxy inputs
        shell: bash
        run: |
          set -euo pipefail
          unset DEBUG_IMAGE ISTIO_ENVOY_LINUX_RELEASE_PATH ISTIO_ENVOY_LINUX_DEBUG_PATH
          # Upload/download preserves the bytes, but not executable file modes.
          # The native envoy_tar archive retains its executable permission.
          for arch in amd64 arm64; do
            artifact="$RUNNER_TEMP/native-proxy-$arch"
            extracted="$RUNNER_TEMP/native-proxy-extracted-$arch"
            mkdir "$extracted"
            tar --extract --gzip --file "$artifact/envoy_tar.tar.gz" --directory "$extracted"
            binary="$extracted/usr/local/bin/envoy"
            test -s "$binary" && test -r "$binary" && test -x "$binary"
            cmp "$artifact/envoy" "$binary"
            header="$(LC_ALL=C readelf --file-header --wide "$binary")"
            grep -Eq 'Class:[[:space:]]+ELF64' <<< "$header"
            case "$arch" in
              amd64) machine='Advanced Micro Devices X86-64' ;;
              arm64) machine='AArch64' ;;
            esac
            grep -Eq "Machine:[[:space:]]+$machine$" <<< "$header"
            printf '%s\n%s\n' "$arch" "$header"
          done
          # Validate both artifacts before initializing either architecture.
          # The outer Makefile runs setup_env and the maintained init recipe
          # creates the marker; never hand-create a stamp or skip Make.
          for arch in amd64 arm64; do
            out="$GITHUB_WORKSPACE/istio/out/linux_$arch"
            env -u DEBUG_IMAGE BUILD_WITH_CONTAINER=0 TARGET_OS=linux TARGET_ARCH="$arch" \
              TARGET_OUT="$out" TARGET_OUT_LINUX="$out" \
              ISTIO_ENVOY_LINUX_RELEASE_PATH="$RUNNER_TEMP/native-proxy-extracted-$arch/usr/local/bin/envoy" \
              make --no-print-directory "$out/istio_is_init"
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        id: builder
        with:
          version: v0.30.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.26.2
          use: false
      - name: Build native multiarch OCI layouts
        env:
          OCI_BUILDER: ${{ steps.builder.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          check_source() {
            local repo="$1" expected="$2" status
            status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"
            printf 'Source status: %s\n%s\n' "$repo" "$status"
            git -C "$repo" diff --stat HEAD --
            test "$(git -C "$repo" rev-parse HEAD)" = "$expected"
            if [[ -n "$status" ]]; then
              echo 'Refusing modified or untracked build source' >&2
              exit 1
            fi
          }
          check_build_sources() {
            check_source . "$GITHUB_SHA"
            local expected
            expected="$(python3 -c 'import json; print(next(x["lastStableSHA"] for x in json.load(open("istio.deps")) if x["name"] == "ZTUNNEL_REPO_SHA"))')"
            check_source "$BUILD_ZTUNNEL_REPO" "$expected"
          }
          check_build_sources
          unset BUILD_ZTUNNEL_TARGET BUILD_ZTUNNEL SKIP_MAKE BUILDX_NO_DEFAULT_ATTESTATIONS
          # RunMake varies TARGET_ARCH per build; one explicit path cannot be
          # inherited by both architectures. Consume the real per-arch init outputs.
          unset DEBUG_IMAGE ISTIO_ENVOY_LINUX_RELEASE_PATH ISTIO_ENVOY_LINUX_DEBUG_PATH
          ./tools/docker --targets pilot,proxyv2,install-cni,ztunnel --variants distroless \
            --architectures linux/amd64,linux/arm64 \
            --oci-output-dir "$RUNNER_TEMP/istio-oci" --oci-builder "$OCI_BUILDER"
          check_build_sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: istio-oci-${{ inputs.artifact_tag }}
          path: ${{ runner.temp }}/istio-oci/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
