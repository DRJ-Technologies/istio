apiVersion: release-notes/v2
kind: feature
area: security
releaseNotes:
  - |
    **Added** opt-in consumption of the namespace's standard SPIFFE Bundle Map through
    SPIFFE_BUNDLE_MAP_PATH. Mesh ROOTCA uses native typed SPIFFE stores per domain;
    compatibility names, aliases and flat PCDS roots confer no mapped authority.
    Initial optional absence permits only own-SVID-qualified local anchors. After
    mapped activation, empty, removed, malformed or unreadable data produces an
    explicit zero-anchor SDS update rather than withdrawing a referenced secret.
    Native templates project the read-only directory without subPath. Mesh contexts
    retain exact URI endpoint constraints and disable session resumption; external
    file/credential and control-plane TLS retain their separate native inputs.
    The existing public CRL projection is included in selected stores for native
    chain revocation checking. Its removal after presence denies mapped trust;
    unsupported per-server CRL or certificate-pin constraints refuse mapped peers.
    Missing selected-chain CRL coverage and existing-connection revocation require
    the paired native Envoy/proxy qualification; this source does not clear runtime.
